name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_OPENWEATHERMAP_KEY: ${{ secrets.VITE_OPENWEATHERMAP_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_LODESTAR_BACKEND_URL: ${{ secrets.VITE_LODESTAR_BACKEND_URL }}
          VITE_WAKE_LAMBDA_URL: ${{ secrets.VITE_WAKE_LAMBDA_URL }}
          VITE_SENSOR_API_URL: ${{ secrets.VITE_SENSOR_API_URL }}
          VITE_BHOONIDHI_USER_ID: ${{ secrets.VITE_BHOONIDHI_USER_ID }}
          VITE_BHOONIDHI_PASSWORD: ${{ secrets.VITE_BHOONIDHI_PASSWORD }}
          VITE_BHUVAN_LULC_KEY: ${{ secrets.VITE_BHUVAN_LULC_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
